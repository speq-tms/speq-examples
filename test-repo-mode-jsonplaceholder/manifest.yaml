version: "1"
project: "jsonplaceholder-api-tests"
defaultEnvironment: "ci"
environmentsDir: "environments"
suitesDir: "suites"
reportsDir: "reports"
schemasDir: "schemas"
modulesDir: "modules"
fixturesDir: "fixtures"
# Transport policy for every outbound request. Narrowed per environment via an
# `http` block in environments/<env>.yaml, and per step via `timeoutMs`.
http:
  timeoutMs: 15000
  connectTimeoutMs: 5000
  followRedirects: true

retry:
  enabled: true
  maxAttempts: 3
  delayMs: 300
  backoff: exponential
  retryOn:
    networkErrors: true
    statusCodes: [429, 502, 503, 504]

coverage:
  enabled: true
  openapi: "./docs/openapi.yaml"
  report: true
  failBelow: null
