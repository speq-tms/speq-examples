# Demonstrates ${ENV_VAR} substitution (speq-tms/speq-docs#60).
#
# Every placeholder here carries a ':-default' so the file resolves with nothing
# exported. That is not a CI workaround: `speq validate` reads every environment
# file in the project, not only the selected one, so a default is what keeps this
# example project runnable by anyone who clones it.
#
# The strict form -- '${VAR}' with no default -- is what a real CI environment
# uses, and it is covered by `scripts/at-env-secrets.sh`, which writes that shape
# and asserts that a missing variable is a load-time error naming the variable
# and the file. That script runs in the gate, so the strict form is proven
# without making the checked-in project depend on an exported secret.
#
# Values that come from the OS environment are tracked as secrets for the rest
# of the run and redacted in the console, summary.json and every Allure
# attachment. A default is written in this file, so it is not redacted.
name: secrets
baseUrl: "${SPEQ_DEMO_BASE_URL:-https://jsonplaceholder.typicode.com}"
headers:
  x-source: speq-examples-jsonplaceholder
  authorization: "Bearer ${SPEQ_DEMO_TOKEN:-unset-placeholder-token}"
