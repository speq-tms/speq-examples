# Demonstrates ${ENV_VAR} substitution (speq-tms/speq-docs#60).
#
# Every placeholder here carries a ':-default' so the file resolves on a
# developer machine with nothing exported, which is what keeps `speq validate`
# green. A real CI environment omits the defaults, so a missing secret is a
# load-time error instead of a request sent with an empty token.
#
# Values that come from the OS environment are tracked as secrets for the rest
# of the run and redacted in the console, summary.json and every Allure
# attachment. A default is written in this file, so it is not redacted.
name: secrets
baseUrl: "${SPEQ_DEMO_BASE_URL:-https://jsonplaceholder.typicode.com}"
headers:
  x-source: speq-examples-jsonplaceholder
  authorization: "Bearer ${SPEQ_DEMO_TOKEN:-unset-placeholder-token}"
