# Bearer credentials on a real API — speq-tms/speq-docs#61.
#
# JSONPlaceholder is public and ignores the header, so what this example proves
# is not that the API accepted the token: it is that the runtime assembles the
# `Authorization` header from a declaration instead of from a hand-written
# string, that a step can refuse the credentials it would otherwise inherit,
# and that neither of those puts a token in the report.
#
# The report is where the assertion lives: `scripts/at-auth.sh` runs this suite
# and checks that the token is present as `***` and nowhere as itself.
id: "auth.bearer-credentials-are-presented"
title: "Auth: a suite presents bearer credentials and a step opts out (Feature: auth)"
tags: [api, http, auth]
steps:
  - type: api
    name: "GET /posts/1 — as the caller the suite declared"
    method: GET
    url: "/posts/1"
    assert:
      - type: status
        expected: 200
  - type: api
    name: "GET /posts/2 — a public probe, sent with no credentials at all"
    method: GET
    url: "/posts/2"
    auth: none
    assert:
      - type: status
        expected: 200
