# The OAuth2 client-credentials flow — speq-tms/speq-docs#61.
#
# Two steps, one token. The run fetches an access token before the first
# request, caches it under the credential set that bought it, and presents the
# same one to the second step: the stub asserts it was asked for a token once,
# not once per request.
#
# The third step opts out. An endpoint that needs no credentials must not be
# sent any — the stub records the absence.
#
# This suite lives outside `suites/` because it needs the stub server that
# `scripts/at-auth.sh` starts; the default `speq run --env ci` must not collect
# it.
id: "auth.oauth2-client-credentials"
title: "Auth: one token per run, presented everywhere it is due (Feature: auth)"
tags: [api, http, auth, oauth2]
steps:
  - type: api
    name: "GET /orders — buys the token"
    method: GET
    url: "/orders"
    assert:
      - type: status
        expected: 200
  - type: api
    name: "GET /orders again — reuses it"
    method: GET
    url: "/orders"
    assert:
      - type: status
        expected: 200
  - type: api
    name: "GET /public — no credentials, none sent"
    method: GET
    url: "/public"
    auth: none
    assert:
      - type: status
        expected: 200
