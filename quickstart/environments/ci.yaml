# Окружение. Имя файла и есть имя окружения: этот файл запускается как --env ci.
# Окружений может быть сколько угодно — ci.yaml, local.yaml, staging.yaml.

# Необязательное поле. CLI его не читает: окружение выбирается по имени файла.
# Как и любой ключ кроме baseUrl, оно просто становится переменной {{name}}.
name: ci

# Единственный ключ с особым смыслом. Подставляется слева ко всем
# относительным URL в шагах, так что "/posts/1" уходит на
# https://jsonplaceholder.typicode.com/posts/1
#
# Шаг с абсолютным URL (http:// или https://) baseUrl игнорирует.
# Значение доступно и как обычная переменная — {{baseUrl}}.
baseUrl: https://jsonplaceholder.typicode.com

# Любой другой ключ верхнего уровня стал бы переменной с тем же именем.
# Например, `postId: 1` дал бы {{postId}} во всех тестах этого окружения.
