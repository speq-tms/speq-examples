# Тест-спека. Любой .yaml в suites/ — отдельный тест; исключение только
# init.yaml, это конфигурация сьюты.

# Идентификатор теста в отчётах. Обязателен, должен быть уникальным.
id: "posts.get-by-id"

# Человекочитаемое название. Обязательно.
title: "GET /posts/1 возвращает пост с ожидаемым содержимым"

# Метки для фильтрации: `speq run --tags smoke`. Необязательно.
tags: [smoke]

# Шаги теста. Нужен хотя бы один непустой блок из steps / setup / cleanup.
steps:
  # type: api — шаг выполняет HTTP-запрос.
  # Второй тип — use, вызов действия модуля или файла с общими шагами.
  - type: api

    # Название шага в отчёте. Обязательное поле, непустое.
    name: "GET /posts/1"

    # GET, POST, PUT, PATCH, DELETE, HEAD или OPTIONS. Регистр не важен.
    method: GET

    # Относительный путь: слева допишется baseUrl из окружения.
    url: "/posts/1"

    # Проверки ответа. Шаг падает, если упала хотя бы одна.
    assert:
      # Сравнение HTTP-кода.
      - type: status
        expected: 200

      # Сравнение значения по пути с expected — строго, по типу:
      # 1 и "1" не равны.
      #
      # path — это не полноценный JSONPath: только ключи объектов через
      # точку ($.address.geo.lat). К элементам массива обратиться нельзя.
      - type: json
        path: "$.id"
        expected: 1

      - type: json
        path: "$.userId"
        expected: 1

      # Проверяет только наличие поля, не заглядывая в значение.
      - type: exists
        path: "$.title"

# Остальные пять типов ассертов (contains, notcontains, regex, schema),
# переменные, генерация данных, фикстуры и модули описаны в
# speq-docs/docs/cli/dsl.md
