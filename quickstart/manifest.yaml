# Манифест проекта. Единственный файл с фиксированным именем: по паре
# manifest.yaml + suites/ CLI и опознаёт корень проекта.

# Версия формата манифеста. Поддерживается только "1".
version: "1"

# Имя проекта. Показывается в `speq doctor` и в отчётах.
project: "speq-quickstart"

# Окружение, которое используется, когда не передан --env.
# Значение — имя файла в environments/ без расширения.
defaultEnvironment: "ci"

# Раскладка каталогов. Все эти ключи необязательны: если их убрать,
# подставятся ровно эти же значения по умолчанию. Здесь они выписаны
# явно, чтобы было видно, откуда что берётся.
environmentsDir: "environments"
suitesDir: "suites"
reportsDir: "reports"

# Не заданы, потому что этому примеру не нужны, — и это нормально:
#   modulesDir  (по умолчанию "modules")   — переиспользуемые действия
#   fixturesDir (по умолчанию "fixtures")  — заготовки тел запросов
#   schemasDir  (по умолчанию "schemas")   — JSON-схемы для ассерта type: schema
#   retry                                  — политика повторов запросов
#   coverage                               — покрытие API по OpenAPI
# Полный справочник: speq-docs/docs/cli/project-layout.md
