name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize SPEQ CI environment
        env:
          SPEQ_CI_BASE_URL: ${{ secrets.SPEQ_CI_BASE_URL }}
          SPEQ_CI_SOURCE_HEADER: ${{ secrets.SPEQ_CI_SOURCE_HEADER }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          base_url = os.environ.get("SPEQ_CI_BASE_URL") or "https://jsonplaceholder.typicode.com"
          source = os.environ.get("SPEQ_CI_SOURCE_HEADER") or "speq-examples-jsonplaceholder"

          path = Path("test-repo-mode-jsonplaceholder/environments/ci.yaml")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              "\n".join(
                  [
                      "name: ci",
                      f"baseUrl: {json.dumps(base_url)}",
                      "headers:",
                      f"  x-source: {json.dumps(source)}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - uses: speq-tms/speq-github-runner@v1
        with:
          mode: run
          speq-root: test-repo-mode-jsonplaceholder
          env: ci
          artifacts-prefix: speq-jsonplaceholder
          allure-dir: test-repo-mode-jsonplaceholder/reports/allure
          summary-output: test-repo-mode-jsonplaceholder/reports/results/summary.json
          upload-artifacts: "true"

  conformance:
    name: examples match the contracts
    runs-on: ubuntu-latest
    # These examples are what the published schemas are validated against, so a
    # change here can break the contracts as easily as a change there can. Same
    # script, run from the other side.
    steps:
      - name: Check out examples
        uses: actions/checkout@v4

      # The release flow keeps a same-named branch in every affected repository
      # -- milestone title == RC branch name -- so an RC here is checked against
      # the matching RC there.
      #
      # The head branch is tried first, because on the final "RC -> main" pull
      # request it is the head that names the release candidate under test;
      # keying off the base would check v1.1.0 against a main that predates it.
      # Then the base, which is what a normal delivery PR into an RC carries.
      # Then main.
      - name: Resolve the matching speq-contracts ref
        id: contracts
        run: |
          resolved=main
          for candidate in "${{ github.head_ref }}" "${{ github.base_ref }}" "${{ github.ref_name }}"; do
            case "$candidate" in
              v*) ;;
              *) continue ;;
            esac
            if git ls-remote --exit-code --heads \
                 https://github.com/speq-tms/speq-contracts.git "$candidate" >/dev/null 2>&1; then
              resolved="$candidate"
              break
            fi
          done
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"
          echo "checking against speq-contracts@$resolved"

      - name: Check out contracts
        uses: actions/checkout@v4
        with:
          repository: speq-tms/speq-contracts
          ref: ${{ steps.contracts.outputs.ref }}
          path: .contracts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema pyyaml referencing

      - name: Check conformance
        run: |
          python3 .contracts/scripts/check-conformance.py \
            --schemas .contracts/schemas \
            --examples . \
            --cases .contracts/tests/cases
